# Alembic configuration for the jobapply platform.
#
# DATABASE_URL must be set in the environment before running any alembic
# command.  Example:
#   export DATABASE_URL="postgresql+psycopg://user:pass@localhost:5432/jobapply"
#
# For local development with SQLite:
#   export DATABASE_URL="sqlite:///./jobapply_dev.db"
#
# Do NOT hard-code credentials here; this file is committed to the repo.

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = alembic

# sqlalchemy.url is intentionally absent — env.py reads DATABASE_URL
# from the environment at runtime so secrets never live in this file.

# Logging — keep alembic output readable without drowning in SQLAlchemy noise.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
